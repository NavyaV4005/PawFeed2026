name: PawFeed Selenium Web Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PawFeedAppium dependencies (for shared tools)
        working-directory: ./PawFeedAppium
        run: npm install

      - name: Install automation dependencies
        working-directory: ./automation
        run: npm install || true

      - name: Execute PawFeed Selenium Web Unit & Load Suite
        working-directory: ./automation
        run: node scripts/run_selenium.js

      - name: Output Summary to GitHub Actions Summary
        working-directory: ./automation
        run: node utils/generateSummary.js

      - name: Upload Selenium Web Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PawFeed-Selenium-Web-Reports
          path: automation/reports/
